<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="Vani project card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#262238"/><stop offset="1" stop-color="#181825"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CBA6F7"/><stop offset="1" stop-color="#89B4FA"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#CBA6F7" stop-opacity=".22"/><stop offset="1" stop-color="#CBA6F7" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CBA6F7" stop-opacity=".45"/><stop offset="1" stop-color="#CDD6F4" stop-opacity=".06"/></linearGradient>
    <clipPath id="c"><rect width="560" height="300" rx="20"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI Variable Display','Segoe UI',Inter,Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,Menlo,'Courier New',monospace}
      .bar{animation:v 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      @keyframes v{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
      .pulse{animation:p 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes p{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.6);opacity:0}}
      .ping{animation:q 2.4s ease-out infinite .6s;transform-box:fill-box;transform-origin:center}
      @keyframes q{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="560" height="300" fill="url(#bg)"/>
    <circle cx="460" cy="130" r="190" fill="url(#glow)"/>
    <rect x=".5" y=".5" width="559" height="299" rx="19.5" fill="none" stroke="url(#edge)"/>
    <text x="30" y="50" class="mono" font-size="11" font-weight="700" letter-spacing="2.5" fill="#CBA6F7">GENAI (LLM) MINI PROJECT · PS-19</text>
    <text x="30" y="94" class="sans" fill="url(#t)" font-size="36" font-weight="700" letter-spacing="-1">Vani</text>
    <text x="30" y="126" class="sans" fill="#BAC2DE" font-size="15">Speak a question and hear the answer:</text>
    <text x="30" y="147" class="sans" fill="#BAC2DE" font-size="15">a voice chatbot for people who type slowly.</text>
    <text x="30" y="178" class="mono" fill="#7F849C" font-size="12">English · Hindi · Marathi · 4 personas · memory</text>
    <g class="mono" font-size="11.5" font-weight="600">
      <rect x="30" y="200" width="66" height="24" rx="12" fill="#89B4FA" fill-opacity=".10" stroke="#89B4FA" stroke-opacity=".35"/><text x="63" y="216" text-anchor="middle" fill="#89B4FA">Python</text>
      <rect x="104" y="200" width="84" height="24" rx="12" fill="#F38BA8" fill-opacity=".10" stroke="#F38BA8" stroke-opacity=".35"/><text x="146" y="216" text-anchor="middle" fill="#F38BA8">Streamlit</text>
      <rect x="196" y="200" width="70" height="24" rx="12" fill="#CBA6F7" fill-opacity=".10" stroke="#CBA6F7" stroke-opacity=".35"/><text x="231" y="216" text-anchor="middle" fill="#CBA6F7">Llama 3</text>
      <rect x="274" y="200" width="74" height="24" rx="12" fill="#A6E3A1" fill-opacity=".10" stroke="#A6E3A1" stroke-opacity=".35"/><text x="311" y="216" text-anchor="middle" fill="#A6E3A1">Whisper</text>
    </g>
    <circle cx="36" cy="262" r="4" fill="#A6E3A1"/><circle class="ping" cx="36" cy="262" r="4" fill="#A6E3A1"/>
    <text x="48" y="267" class="mono" fill="#CBA6F7" font-size="13">vani-ps19.streamlit.app</text>

    <g transform="translate(466,138)">
      <circle class="pulse" r="58" fill="none" stroke="#CBA6F7" stroke-width="2"/>
      <circle r="58" fill="#11111B" fill-opacity=".55" stroke="#CDD6F4" stroke-opacity=".10" stroke-width="8"/>
      <g fill="url(#t)">
        <rect class="bar" x="-34" y="-12" width="8" height="24" rx="4" style="animation-delay:.1s"/>
        <rect class="bar" x="-20" y="-26" width="8" height="52" rx="4" style="animation-delay:.35s"/>
        <rect class="bar" x="-6" y="-36" width="8" height="72" rx="4"/>
        <rect class="bar" x="8" y="-24" width="8" height="48" rx="4" style="animation-delay:.5s"/>
        <rect class="bar" x="22" y="-14" width="8" height="28" rx="4" style="animation-delay:.2s"/>
      </g>
    </g>
  </g>
</svg>
