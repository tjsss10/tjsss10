<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="FitJanta project card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A0D10"/><stop offset="1" stop-color="#0A0D12"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8A2B"/><stop offset=".55" stop-color="#FF4D4D"/><stop offset="1" stop-color="#FF2E7E"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF4D4D" stop-opacity=".45"/><stop offset="1" stop-color="#FF4D4D" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="560" height="300" rx="20"/></clipPath>
    <style>
      text{font-family:'Segoe UI',Inter,Arial,sans-serif}
      .ring{animation:r 3s ease-in-out infinite alternate}
      @keyframes r{from{stroke-dashoffset:300}to{stroke-dashoffset:70}}
      .beat{animation:b 1.1s ease-in-out infinite;transform-origin:460px 130px}
      @keyframes b{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="560" height="300" fill="url(#bg)"/>
    <circle cx="460" cy="130" r="170" fill="url(#glow)"/>
    <rect x=".5" y=".5" width="559" height="299" rx="20" fill="none" stroke="#FF7A2F" stroke-opacity=".3"/>
    <text x="30" y="52" fill="#FDBA74" font-size="13" font-weight="700" letter-spacing="2">🏃 FITNESS · SOCIAL · LIVE</text>
    <text x="30" y="96" fill="url(#t)" font-size="38" font-weight="800">FitJanta</text>
    <text x="30" y="128" fill="#C9C2C4" font-size="15">Track workouts, log meals with an AI</text>
    <text x="30" y="150" fill="#C9C2C4" font-size="15">nutrition engine, and compete with friends.</text>
    <text x="30" y="182" fill="#8C96A8" font-size="13">Challenges · XP &amp; levels · territory map · feed · leaderboard</text>
    <g font-size="12" font-weight="700">
      <rect x="30" y="206" width="56" height="26" rx="13" fill="#FF7A2F" fill-opacity=".16"/><text x="44" y="223" fill="#FDBA74">Java</text>
      <rect x="94" y="206" width="100" height="26" rx="13" fill="#FF7A2F" fill-opacity=".16"/><text x="108" y="223" fill="#FDBA74">Spring Boot</text>
      <rect x="202" y="206" width="64" height="26" rx="13" fill="#FF2E7E" fill-opacity=".16"/><text x="215" y="223" fill="#F9A8D4">MySQL</text>
      <rect x="274" y="206" width="54" height="26" rx="13" fill="#FF2E7E" fill-opacity=".16"/><text x="288" y="223" fill="#F9A8D4">PWA</text>
    </g>
    <text x="30" y="270" fill="#FF7A2F" font-size="14" font-weight="700">▶ fitjanta.onrender.com</text>
    <g transform="translate(460,130)">
      <circle r="62" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="12"/>
      <circle class="ring" r="62" fill="none" stroke="url(#t)" stroke-width="12" stroke-linecap="round" stroke-dasharray="390" stroke-dashoffset="120" transform="rotate(-90)"/>
    </g>
    <path class="beat" d="M460 152 C430 130 420 112 434 100 C446 90 458 98 460 106 C462 98 474 90 486 100 C500 112 490 130 460 152Z" fill="#FF4D4D"/>
  </g>
</svg>
