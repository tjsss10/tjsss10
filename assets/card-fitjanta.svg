<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="FitJanta project card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2024"/><stop offset="1" stop-color="#181825"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FAB387"/><stop offset="1" stop-color="#F5C2E7"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F5C2E7" stop-opacity=".2"/><stop offset="1" stop-color="#F5C2E7" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAB387" stop-opacity=".45"/><stop offset="1" stop-color="#CDD6F4" stop-opacity=".06"/></linearGradient>
    <clipPath id="c"><rect width="560" height="300" rx="20"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI Variable Display','Segoe UI',Inter,Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,Menlo,'Courier New',monospace}
      .ring{animation:r 3.5s ease-in-out infinite alternate}
      @keyframes r{from{stroke-dashoffset:330}to{stroke-dashoffset:90}}
      .ring2{animation:r2 4.5s ease-in-out infinite alternate}
      @keyframes r2{from{stroke-dashoffset:250}to{stroke-dashoffset:110}}
      .ping{animation:p 2.4s ease-out infinite .6s;transform-box:fill-box;transform-origin:center}
      @keyframes p{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="560" height="300" fill="url(#bg)"/>
    <circle cx="460" cy="130" r="190" fill="url(#glow)"/>
    <rect x=".5" y=".5" width="559" height="299" rx="19.5" fill="none" stroke="url(#edge)"/>
    <text x="30" y="50" class="mono" font-size="11" font-weight="700" letter-spacing="2.5" fill="#FAB387">BUILT @ HCLTECH INTERNSHIP</text>
    <text x="30" y="94" class="sans" fill="url(#t)" font-size="36" font-weight="700" letter-spacing="-1">FitJanta</text>
    <text x="30" y="126" class="sans" fill="#BAC2DE" font-size="15">Log workouts and meals, let the AI count</text>
    <text x="30" y="147" class="sans" fill="#BAC2DE" font-size="15">the nutrition, and compete with friends.</text>
    <text x="30" y="178" class="mono" fill="#7F849C" font-size="12">challenges · XP &amp; levels · territory map · feed</text>
    <g class="mono" font-size="11.5" font-weight="600">
      <rect x="30" y="200" width="54" height="24" rx="12" fill="#FAB387" fill-opacity=".10" stroke="#FAB387" stroke-opacity=".35"/><text x="57" y="216" text-anchor="middle" fill="#FAB387">Java</text>
      <rect x="92" y="200" width="98" height="24" rx="12" fill="#A6E3A1" fill-opacity=".10" stroke="#A6E3A1" stroke-opacity=".35"/><text x="141" y="216" text-anchor="middle" fill="#A6E3A1">Spring Boot</text>
      <rect x="198" y="200" width="64" height="24" rx="12" fill="#89DCEB" fill-opacity=".10" stroke="#89DCEB" stroke-opacity=".35"/><text x="230" y="216" text-anchor="middle" fill="#89DCEB">MySQL</text>
      <rect x="270" y="200" width="52" height="24" rx="12" fill="#F5C2E7" fill-opacity=".10" stroke="#F5C2E7" stroke-opacity=".35"/><text x="296" y="216" text-anchor="middle" fill="#F5C2E7">PWA</text>
    </g>
    <circle cx="36" cy="262" r="4" fill="#A6E3A1"/><circle class="ping" cx="36" cy="262" r="4" fill="#A6E3A1"/>
    <text x="48" y="267" class="mono" fill="#FAB387" font-size="13">fitjanta.onrender.com</text>

    <g transform="translate(466,138)">
      <circle r="64" fill="none" stroke="#CDD6F4" stroke-opacity=".07" stroke-width="10"/>
      <circle class="ring" r="64" fill="none" stroke="#FAB387" stroke-width="10" stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="150" transform="rotate(-90)"/>
      <circle r="46" fill="none" stroke="#CDD6F4" stroke-opacity=".07" stroke-width="10"/>
      <circle class="ring2" r="46" fill="none" stroke="#F5C2E7" stroke-width="10" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="150" transform="rotate(-90)"/>
      <text y="-2" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#CDD6F4">Lv 7</text>
      <text y="16" text-anchor="middle" class="mono" font-size="10" fill="#A6ADC8">640 XP</text>
    </g>
  </g>
</svg>
