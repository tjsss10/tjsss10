<svg xmlns="http://www.w3.org/2000/svg" width="330" height="46" viewBox="0 0 330 46" role="img" aria-label="FitJanta live demo: fitjanta.onrender.com">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B0D0D"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
    <style>
      .m{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
      .ring{animation:r 1.8s ease-out infinite;transform-origin:22px 23px}
      @keyframes r{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
      .sh{animation:s 3.5s ease-in-out infinite 1.2s}
      @keyframes s{0%{transform:translateX(-120px)}60%,100%{transform:translateX(360px)}}
    </style>
    <clipPath id="c"><rect width="330" height="46" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="330" height="46" fill="url(#b)"/>
    <rect class="sh" x="0" y="0" width="60" height="46" fill="#FB923C" opacity=".08" transform="skewX(-20)"/>
    <rect x=".5" y=".5" width="329" height="45" rx="11.5" fill="none" stroke="#FF5A3C" stroke-opacity=".6"/>
    <circle class="ring" cx="22" cy="23" r="6" fill="#22C55E"/>
    <circle cx="22" cy="23" r="5" fill="#4ADE80"/>
    <text x="38" y="20" class="m" font-size="10" font-weight="700" letter-spacing="1.5" fill="#FDBA74">LIVE DEMO · 🏃 FITJANTA</text>
    <text x="38" y="36" class="m" font-size="12.5" fill="#E2E8F0">fitjanta.onrender.com ↗</text>
  </g>
</svg>
