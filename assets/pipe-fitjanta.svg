<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="How FitJanta works: log a workout or meal, Food AI nutrition, XP and levels, challenges and territory map, leaderboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2024"/><stop offset="1" stop-color="#181825"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FAB387"/><stop offset="1" stop-color="#F5C2E7"/></linearGradient>
    <clipPath id="c"><rect width="560" height="200" rx="18"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI Variable Display','Segoe UI',Inter,Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,Menlo,'Courier New',monospace}
      .n{animation:n 5s ease-in-out infinite}
      @keyframes n{0%,100%{stroke-opacity:.3}10%{stroke-opacity:1}25%{stroke-opacity:.3}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="560" height="200" fill="url(#bg)"/>
    <rect x=".5" y=".5" width="559" height="199" rx="17.5" fill="none" stroke="#FAB387" stroke-opacity=".22"/>
    <text x="22" y="32" class="mono" font-size="10.5" font-weight="700" letter-spacing="2.4" fill="#FAB387">HOW IT WORKS</text>
    <text x="538" y="32" text-anchor="end" class="mono" font-size="10.5" fill="#7F849C">Spring Boot REST · MySQL · PWA</text>

    <path id="flow" d="M60 92 H500" stroke="#CDD6F4" stroke-opacity=".10" stroke-width="2" fill="none"/>
    <path d="M60 92 H500" stroke="url(#line)" stroke-width="2" fill="none" stroke-dasharray="4 10" opacity=".55"/>
    <circle r="5" fill="#FAB387">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
    </circle>

    <g class="sans" text-anchor="middle">
      <g transform="translate(60,92)">
        <circle r="27" fill="#11111B" stroke="#FAB387" stroke-width="1.5" class="n"/>
        <text y="7" font-size="20">🏋️</text>
        <text y="50" font-size="12.5" font-weight="700" fill="#CDD6F4">Log</text>
        <text y="66" font-size="10.5" fill="#7F849C">workout / meal</text>
      </g>
      <g transform="translate(170,92)">
        <circle r="27" fill="#11111B" stroke="#F9E2AF" stroke-width="1.5" class="n" style="animation-delay:1s"/>
        <text y="7" font-size="20">🍛</text>
        <text y="50" font-size="12.5" font-weight="700" fill="#CDD6F4">Food AI</text>
        <text y="66" font-size="10.5" fill="#7F849C">calories · macros</text>
      </g>
      <g transform="translate(280,92)">
        <circle r="27" fill="#11111B" stroke="#F5C2E7" stroke-width="1.5" class="n" style="animation-delay:2s"/>
        <text y="7" font-size="20">⚡</text>
        <text y="50" font-size="12.5" font-weight="700" fill="#CDD6F4">XP &amp; levels</text>
        <text y="66" font-size="10.5" fill="#7F849C">streaks</text>
      </g>
      <g transform="translate(390,92)">
        <circle r="27" fill="#11111B" stroke="#CBA6F7" stroke-width="1.5" class="n" style="animation-delay:3s"/>
        <text y="7" font-size="20">🗺️</text>
        <text y="50" font-size="12.5" font-weight="700" fill="#CDD6F4">Compete</text>
        <text y="66" font-size="10.5" fill="#7F849C">challenges · map</text>
      </g>
      <g transform="translate(500,92)">
        <circle r="27" fill="#11111B" stroke="#B4BEFE" stroke-width="1.5" class="n" style="animation-delay:4s"/>
        <text y="7" font-size="20">🏆</text>
        <text y="50" font-size="12.5" font-weight="700" fill="#CDD6F4">Share</text>
        <text y="66" font-size="10.5" fill="#7F849C">feed · leaderboard</text>
      </g>
    </g>
    <text x="280" y="186" text-anchor="middle" class="mono" font-size="10.5" fill="#6C7086">BCrypt auth · photo posts · live location · QR to phone</text>
  </g>
</svg>
