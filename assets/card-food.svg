<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="Food Delivery App — Agile Scrum team project with 5 user stories and 29 story points">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B2620"/><stop offset="1" stop-color="#181825"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F9E2AF"/><stop offset="1" stop-color="#FAB387"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F9E2AF" stop-opacity=".18"/><stop offset="1" stop-color="#F9E2AF" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9E2AF" stop-opacity=".45"/><stop offset="1" stop-color="#CDD6F4" stop-opacity=".06"/></linearGradient>
    <clipPath id="c"><rect width="560" height="300" rx="20"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI Variable Display','Segoe UI',Inter,Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,Menlo,'Courier New',monospace}
      .move{animation:m 7s ease-in-out infinite}
      @keyframes m{0%,15%{transform:translate(0,0)}35%,55%{transform:translate(64px,0)}75%,100%{transform:translate(128px,0)}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="560" height="300" fill="url(#bg)"/>
    <circle cx="440" cy="140" r="190" fill="url(#glow)"/>
    <rect x=".5" y=".5" width="559" height="299" rx="19.5" fill="none" stroke="url(#edge)"/>
    <text x="30" y="50" class="mono" font-size="11" font-weight="700" letter-spacing="2.5" fill="#F9E2AF">SCRUM · TEAM PROJECT</text>
    <text x="30" y="94" class="sans" fill="url(#t)" font-size="32" font-weight="700" letter-spacing="-1">Food Delivery App</text>
    <text x="30" y="126" class="sans" fill="#BAC2DE" font-size="14.5">A full Scrum cycle — backlog, planning poker,</text>
    <text x="30" y="146" class="sans" fill="#BAC2DE" font-size="14.5">sprints, burn-down charts and CI on GitHub.</text>
    <g class="sans">
      <text x="30" y="194" font-size="30" font-weight="700" fill="#F9E2AF">5</text><text x="52" y="194" font-size="12" fill="#A6ADC8">user stories</text>
      <text x="122" y="194" font-size="30" font-weight="700" fill="#FAB387">29</text><text x="160" y="194" font-size="12" fill="#A6ADC8">points</text>
      <text x="220" y="194" font-size="30" font-weight="700" fill="#F5C2E7">3</text><text x="242" y="194" font-size="12" fill="#A6ADC8">Scrum roles</text>
    </g>
    <g class="mono" font-size="11.5" font-weight="600">
      <rect x="30" y="236" width="66" height="24" rx="12" fill="#F9E2AF" fill-opacity=".10" stroke="#F9E2AF" stroke-opacity=".35"/><text x="63" y="252" text-anchor="middle" fill="#F9E2AF">Scrum</text>
      <rect x="104" y="236" width="66" height="24" rx="12" fill="#89B4FA" fill-opacity=".10" stroke="#89B4FA" stroke-opacity=".35"/><text x="137" y="252" text-anchor="middle" fill="#89B4FA">Trello</text>
      <rect x="178" y="236" width="122" height="24" rx="12" fill="#A6E3A1" fill-opacity=".10" stroke="#A6E3A1" stroke-opacity=".35"/><text x="239" y="252" text-anchor="middle" fill="#A6E3A1">GitHub Actions</text>
    </g>

    <!-- mini scrum board -->
    <g transform="translate(340,58)">
      <rect width="196" height="186" rx="16" fill="#11111B" fill-opacity=".75" stroke="#F9E2AF" stroke-opacity=".25"/>
      <g class="mono" font-size="9" font-weight="700" fill="#A6ADC8" text-anchor="middle">
        <text x="34" y="22">TO DO</text><text x="98" y="22">DOING</text><text x="162" y="22">DONE</text>
      </g>
      <path d="M66 32 V172 M130 32 V172" stroke="#CDD6F4" stroke-opacity=".07"/>
      <!-- static story cards from the real backlog -->
      <g class="mono" font-size="8.5">
        <rect x="8" y="34" width="52" height="22" rx="5" fill="#F9E2AF" fill-opacity=".14" stroke="#F9E2AF" stroke-opacity=".35"/><text x="34" y="48" text-anchor="middle" fill="#F9E2AF">US-1 · 5</text>
        <rect x="8" y="86" width="52" height="22" rx="5" fill="#F9E2AF" fill-opacity=".14" stroke="#F9E2AF" stroke-opacity=".35"/><text x="34" y="100" text-anchor="middle" fill="#F9E2AF">US-3 · 8</text>
        <rect x="8" y="112" width="52" height="22" rx="5" fill="#F9E2AF" fill-opacity=".14" stroke="#F9E2AF" stroke-opacity=".35"/><text x="34" y="126" text-anchor="middle" fill="#F9E2AF">US-5 · 3</text>
        <rect x="72" y="34" width="52" height="22" rx="5" fill="#FAB387" fill-opacity=".16" stroke="#FAB387" stroke-opacity=".45"/><text x="98" y="48" text-anchor="middle" fill="#FAB387">US-2 · 8</text>
        <rect x="136" y="34" width="52" height="22" rx="5" fill="#A6E3A1" fill-opacity=".14" stroke="#A6E3A1" stroke-opacity=".45"/><text x="162" y="48" text-anchor="middle" fill="#A6E3A1">US-4 ✓</text>
      </g>
      <!-- a story moving across the board -->
      <g class="move mono" font-size="8.5">
        <rect x="8" y="60" width="52" height="22" rx="5" fill="#F5C2E7" fill-opacity=".2" stroke="#F5C2E7" stroke-opacity=".7"/><text x="34" y="74" text-anchor="middle" fill="#F5C2E7">sprint ▸</text>
      </g>
      <!-- burn-down -->
      <path d="M12 176 L60 166 L104 160 L148 150 L186 142" stroke="#CDD6F4" stroke-opacity=".15" fill="none"/>
      <path d="M12 142 L60 150 L104 160 L148 168 L186 176" stroke="#FAB387" stroke-width="1.8" fill="none" stroke-dasharray="200" stroke-dashoffset="200">
        <animate attributeName="stroke-dashoffset" values="200;0;0" keyTimes="0;.6;1" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
