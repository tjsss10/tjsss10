<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="College Event Management System project card — Project Lead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F2033"/><stop offset="1" stop-color="#181825"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B4BEFE"/><stop offset="1" stop-color="#89DCEB"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#B4BEFE" stop-opacity=".22"/><stop offset="1" stop-color="#B4BEFE" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B4BEFE" stop-opacity=".45"/><stop offset="1" stop-color="#CDD6F4" stop-opacity=".06"/></linearGradient>
    <clipPath id="c"><rect width="560" height="300" rx="20"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI Variable Display','Segoe UI',Inter,Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,Menlo,'Courier New',monospace}
      .pick{animation:p 6s ease-in-out infinite}
      @keyframes p{0%,100%{transform:translate(0,0)}25%{transform:translate(24px,0)}50%{transform:translate(24px,22px)}75%{transform:translate(48px,22px)}}
      .reg{animation:r 3s ease-in-out infinite}
      @keyframes r{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="560" height="300" fill="url(#bg)"/>
    <circle cx="460" cy="130" r="190" fill="url(#glow)"/>
    <rect x=".5" y=".5" width="559" height="299" rx="19.5" fill="none" stroke="url(#edge)"/>
    <text x="30" y="50" class="mono" font-size="11" font-weight="700" letter-spacing="2.5" fill="#B4BEFE">AGILE · ACADEMIC PROJECT</text>
    <text x="30" y="90" class="sans" fill="url(#t)" font-size="28" font-weight="700" letter-spacing="-.8">College Event</text>
    <text x="30" y="122" class="sans" fill="url(#t)" font-size="28" font-weight="700" letter-spacing="-.8">Management System</text>
    <g transform="translate(30,140)">
      <rect width="116" height="26" rx="13" fill="#CBA6F7" fill-opacity=".15" stroke="#CBA6F7" stroke-opacity=".55"/>
      <text x="58" y="17.5" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#CBA6F7">★ PROJECT LEAD</text>
    </g>
    <text x="30" y="194" class="sans" fill="#BAC2DE" font-size="14.5">Admins create events, students register,</text>
    <text x="30" y="214" class="sans" fill="#BAC2DE" font-size="14.5">organisers track participation.</text>
    <g class="mono" font-size="11.5" font-weight="600">
      <rect x="30" y="236" width="60" height="24" rx="12" fill="#B4BEFE" fill-opacity=".10" stroke="#B4BEFE" stroke-opacity=".35"/><text x="60" y="252" text-anchor="middle" fill="#B4BEFE">Agile</text>
      <rect x="98" y="236" width="122" height="24" rx="12" fill="#89DCEB" fill-opacity=".10" stroke="#89DCEB" stroke-opacity=".35"/><text x="159" y="252" text-anchor="middle" fill="#89DCEB">GitHub Actions</text>
      <rect x="228" y="236" width="58" height="24" rx="12" fill="#F5C2E7" fill-opacity=".10" stroke="#F5C2E7" stroke-opacity=".35"/><text x="257" y="252" text-anchor="middle" fill="#F5C2E7">CI/CD</text>
    </g>

    <!-- calendar -->
    <g transform="translate(372,62)">
      <rect width="156" height="164" rx="16" fill="#11111B" fill-opacity=".75" stroke="#B4BEFE" stroke-opacity=".3"/>
      <rect width="156" height="34" rx="16" fill="#B4BEFE" fill-opacity=".18"/>
      <rect y="18" width="156" height="16" fill="#B4BEFE" fill-opacity=".18"/>
      <text x="78" y="23" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#B4BEFE">EVENTS</text>
      <g fill="#CDD6F4" fill-opacity=".09">
        <rect x="14" y="46" width="18" height="16" rx="4"/><rect x="38" y="46" width="18" height="16" rx="4"/><rect x="62" y="46" width="18" height="16" rx="4"/><rect x="86" y="46" width="18" height="16" rx="4"/><rect x="110" y="46" width="18" height="16" rx="4"/>
        <rect x="14" y="68" width="18" height="16" rx="4"/><rect x="38" y="68" width="18" height="16" rx="4"/><rect x="62" y="68" width="18" height="16" rx="4"/><rect x="86" y="68" width="18" height="16" rx="4"/><rect x="110" y="68" width="18" height="16" rx="4"/>
        <rect x="14" y="90" width="18" height="16" rx="4"/><rect x="38" y="90" width="18" height="16" rx="4"/><rect x="62" y="90" width="18" height="16" rx="4"/><rect x="86" y="90" width="18" height="16" rx="4"/><rect x="110" y="90" width="18" height="16" rx="4"/>
      </g>
      <rect x="62" y="46" width="18" height="16" rx="4" fill="#F5C2E7" fill-opacity=".55"/>
      <rect x="110" y="68" width="18" height="16" rx="4" fill="#89DCEB" fill-opacity=".55"/>
      <rect class="pick" x="14" y="46" width="18" height="16" rx="4" fill="none" stroke="#CBA6F7" stroke-width="2"/>
      <g class="reg">
        <rect x="14" y="120" width="128" height="30" rx="9" fill="#A6E3A1" fill-opacity=".12" stroke="#A6E3A1" stroke-opacity=".45"/>
        <text x="78" y="139" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#A6E3A1">✓ Registered</text>
      </g>
    </g>
  </g>
</svg>
