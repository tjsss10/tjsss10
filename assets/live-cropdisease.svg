<svg xmlns="http://www.w3.org/2000/svg" width="580" height="124" viewBox="0 0 580 124" role="img" aria-label="CropDisease AI — live app at cropdisease-ai-pro.onrender.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D2B27"/><stop offset=".55" stop-color="#1A1F26"/><stop offset="1" stop-color="#181825"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A6E3A1" stop-opacity=".75"/><stop offset=".6" stop-color="#94E2D5" stop-opacity=".25"/><stop offset="1" stop-color="#CDD6F4" stop-opacity=".08"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A6E3A1"/><stop offset="1" stop-color="#94E2D5"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C5F0C0"/><stop offset="1" stop-color="#7CC08A"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#A6E3A1" stop-opacity=".28"/><stop offset="1" stop-color="#A6E3A1" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="580" height="124" rx="22"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI Variable Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
      .ring{animation:r 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes r{0%{transform:scale(.8);opacity:.8}100%{transform:scale(2.8);opacity:0}}
      .sweep{animation:s 6s ease-in-out infinite}
      @keyframes s{0%{transform:translateX(-200px) skewX(-18deg)}50%,100%{transform:translateX(700px) skewX(-18deg)}}
      .scan{animation:sc 2.8s ease-in-out infinite}
      @keyframes sc{0%,100%{transform:translateY(0)}50%{transform:translateY(46px)}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="580" height="124" fill="url(#bg)"/>
    <circle cx="70" cy="62" r="110" fill="url(#glow)"/>
    <rect class="sweep" x="0" y="-20" width="90" height="170" fill="#F5E0DC" opacity=".05"/>
    <rect x="1" y="1" width="578" height="122" rx="21" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

    <!-- icon tile -->
    <rect x="24" y="24" width="76" height="76" rx="20" fill="#11111B" fill-opacity=".65" stroke="#A6E3A1" stroke-opacity=".35"/>
    <g transform="translate(62,62)">
      <path d="M0 -28 C17 -18 25 -2 19 14 C14 26 5 30 0 30 C-5 30 -14 26 -19 14 C-25 -2 -17 -18 0 -28Z" fill="url(#leaf)"/>
      <path d="M0 -24 V28 M0 -8 L-9 -14 M0 -8 L9 -14 M0 6 L-11 -1 M0 6 L11 -1" stroke="#4E7A57" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <circle cx="-8" cy="2" r="4" fill="#B98A6A"/><circle cx="9" cy="14" r="5" fill="#B98A6A"/>
      <rect class="scan" x="-24" y="-24" width="48" height="2" rx="1" fill="#94E2D5"/>
    </g>

    <text x="122" y="46" class="mono" font-size="11" font-weight="700" letter-spacing="2.4" fill="#94E2D5">AI CROP DOCTOR · LIVE APP</text>
    <text x="121" y="80" class="sans" font-size="29" font-weight="700" letter-spacing="-.8" fill="url(#title)">CropDisease AI</text>
    <text x="122" y="104" class="mono" font-size="13.5" fill="#CDD6F4">cropdisease-ai-pro.onrender.com</text>

    <!-- live tag -->
    <g transform="translate(452,24)">
      <rect width="100" height="32" rx="16" fill="#A6E3A1" fill-opacity=".14" stroke="#A6E3A1" stroke-opacity=".6"/>
      <circle class="ring" cx="22" cy="16" r="5" fill="#A6E3A1"/>
      <circle cx="22" cy="16" r="5" fill="#A6E3A1"/>
      <text x="36" y="21" class="mono" font-size="13" font-weight="800" letter-spacing="2" fill="#A6E3A1">LIVE</text>
    </g>
    <!-- open button -->
    <g transform="translate(452,72)">
      <rect width="100" height="32" rx="16" fill="#CDD6F4" fill-opacity=".06" stroke="#CDD6F4" stroke-opacity=".18"/>
      <text x="50" y="21" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#CDD6F4">Open  ↗</text>
    </g>
  </g>
</svg>
