<svg xmlns="http://www.w3.org/2000/svg" width="330" height="50" viewBox="0 0 330 50" role="img" aria-label="CropDisease AI live demo: cropdisease-ai-pro.onrender.com">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F2A26"/><stop offset="1" stop-color="#181825"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A6E3A1" stop-opacity=".7"/><stop offset="1" stop-color="#94E2D5" stop-opacity=".2"/></linearGradient>
    <style>
      .m{font-family:'Cascadia Code',Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
      .ring{animation:r 2.4s ease-out infinite;transform-origin:24px 25px}
      @keyframes r{0%{transform:scale(.7);opacity:.7}100%{transform:scale(2.6);opacity:0}}
      .sh{animation:s 5s ease-in-out infinite}
      @keyframes s{0%{transform:translateX(-140px)}55%,100%{transform:translateX(380px)}}
    </style>
    <clipPath id="c"><rect width="330" height="50" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="330" height="50" fill="url(#b)"/>
    <rect class="sh" x="0" y="-10" width="70" height="70" fill="#F5E0DC" opacity=".05" transform="skewX(-20)"/>
    <rect x=".5" y=".5" width="329" height="49" rx="13.5" fill="none" stroke="url(#edge)"/>
    <circle class="ring" cx="24" cy="25" r="6" fill="#A6E3A1"/>
    <circle cx="24" cy="25" r="4.5" fill="#A6E3A1"/>
    <text x="42" y="21" class="m" font-size="9.5" font-weight="700" letter-spacing="2" fill="#A6E3A1">LIVE · CROPDISEASE AI</text>
    <text x="42" y="38" class="m" font-size="12.5" fill="#CDD6F4">cropdisease-ai-pro.onrender.com <tspan fill="#94E2D5">↗</tspan></text>
  </g>
</svg>
